plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

group = 'dev.zenithvisuals'
version = '1.4.8'
base { archivesName = 'ZenithVisuals' }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:intermediary:1.21.11:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.5+1.21.11'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
